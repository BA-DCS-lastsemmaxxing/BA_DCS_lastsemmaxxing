name: Terraform Destroy

on:
  workflow_dispatch: # Trigger manually through GitHub UI

jobs:
  destroy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code repository
      - name: Checkout code
        uses: actions/checkout@v2

      # Set up Terraform
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: "1.4.0" # Choose your Terraform version

      # Configure AWS credentials (Make sure you add AWS credentials as GitHub secrets)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Initialize Terraform
      - name: Terraform Init
        run: terraform init

      # Optionally, you can run `terraform plan` before destroying to see what will happen
      - name: Terraform Plan (Optional)
        run: terraform plan -destroy

      # Run `terraform destroy` to remove resources
      - name: Terraform Destroy
        run: terraform destroy -auto-approve
