name: Lambda Deployment Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "serverless/**"
  workflow_dispatch:

jobs:
  deploy-to-S3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Configure AWS Credentials (AP-SOUTHEAST-1)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Zip Layer and Deploy
        run: |
          cd ./serverless/lambda_layer
          mkdir -p dist
          zip -r dist/lambda_layer.zip python
          aws s3 cp dist/lambda_layer.zip s3://${{ vars.AWS_LAMBDA_BUCKET }}-ap

      - name: Zip Document Classification Dependencies and Deploy
        run: |
          cd ./serverless/document_classification_dependencies_layer_1
          mkdir -p dist
          zip -r dist/document_classification_dependencies_1.zip python
          aws s3 cp dist/document_classification_dependencies_1.zip s3://${{ vars.AWS_LAMBDA_BUCKET }}-ap

      - name: Zip Document Classification Dependencies and Deploy
        run: |
          cd ./serverless/document_classification_dependencies_layer_2
          mkdir -p dist
          zip -r dist/document_classification_dependencies_2.zip python
          aws s3 cp dist/document_classification_dependencies_2.zip s3://${{ vars.AWS_LAMBDA_BUCKET }}-ap

      - name: Zip Functions and Deploy
        run: |
          mkdir -p dist
          for lambda_file in ./serverless/*.py; do
            function_name=$(basename $lambda_file .py)
            zip -j dist/$function_name.zip $lambda_file
            aws s3 cp dist/$function_name.zip s3://${{ vars.AWS_LAMBDA_BUCKET }}-ap
          done

      - name: Configure AWS Credentials (US-EAST-1)
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Zip Functions and Deploy
        run: |
          mkdir -p dist
          for lambda_file in ./serverless/authoriser/*.py; do
            function_name=$(basename $lambda_file .py)
            zip -j dist/$function_name.zip $lambda_file
            aws s3 cp dist/$function_name.zip s3://${{ vars.AWS_LAMBDA_BUCKET }}-us
          done
